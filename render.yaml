# Готовый план развёртывания для Render.com
# Документация: https://render.com/docs/blueprint-spec
#
# ВАЖНО: диск (disk) доступен только на платных тарифах.
# Если разворачиваете на бесплатном тарифе — удалите блоки disk и DATA_DIR,
# но помните: на бесплатном тарифе заявки могут обнулиться при перезапуске.

services:
  - type: web
    name: malina-studio
    runtime: node
    region: frankfurt
    plan: starter          # starter = платный (~$7/мес). Для free: plan: free и убрать disk
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: malina-data
      mountPath: /var/data
      sizeGB: 1

# Что это даёт:
#   DATA_DIR=/var/data  — заявки, настройки и фотографии лежат на постоянном диске
#                         и не теряются при перезапуске и обновлении сайта.
#   /healthz            — хостинг сам проверяет, что сайт жив.
#   NODE_VERSION=20     — понятная версия Node.js вместо случайной.
